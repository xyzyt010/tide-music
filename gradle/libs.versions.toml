[versions]
androidGradlePlugin = "9.0.1"
# NOTE (Nov 2026): core/lifecycle/compose/coil are pinned below latest, NOT from
# neglect — their newest releases require AGP 9.1.0+ and compileSdk 37, but this
# machine cannot download Gradle 9.3.1+ (network-blocked), so AGP stays 9.0.1 and
# compileSdk stays 36. Each pin is the newest version whose AAR metadata passes
# :app:checkStandardDebugAarMetadata on AGP 9.0.1 (probed 2026-11-23):
# core ceiling 1.18.0 (1.19.0 fails), lifecycle ceiling 2.10.0 (2.11.0 fails),
# compose BOM ceiling 2026.06.01 (2026.08.00 fails), coil ceiling 3.5.0 (3.6.0 fails).
# When the toolchain can move to AGP 9.1+/Gradle 9.3.1+/compileSdk 37, bump to:
# core 1.19.1, lifecycle 2.11.1, compose BOM 2026.11.01, coil 3.6.3.
# At latest with zero gate: media3 1.11.1, room 2.8.5, nav3 1.2.2, coroutines 1.11.0,
# kotlin 2.3.21, ksp 2.3.14, androidx.media 1.8.0, youtubedl-android 0.18.1
# (0.18.1 IS the latest on Maven Central — verified via maven-metadata).
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.06.01"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.11.0"
junit = "4.13.2"
kotlin = "2.3.21"
nav3Core = "1.2.2"
lifecycleViewmodelNav3 = "2.10.0"

# Domain-specific (added for Tide Music build)
media3 = "1.11.1"
room = "2.8.5"
hilt = "2.56.2"
hiltNavigationCompose = "1.4.0"
# KSP2: decoupled versioning (independent of Kotlin patch version).
ksp = "2.3.14"
# Coil 3 — async image loading incl. embedded album art decode
# (3.6.3 needs AGP 9.1+/compileSdk 37; pinned — see note above)
coil = "3.5.0"
# youtubedl-android — yt-dlp executable wrapper for the Download screen
# Latest on Maven Central as of Nov 2026 is 0.18.1 (verified via maven-metadata).
youtubedl = "0.18.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"}
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Media3 — ExoPlayer + media session + notification provider
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# Room — local persistence for library metadata, queue, eq presets.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Hilt — dependency injection for the repository/viewmodel graph
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Coil 3 — async image loading incl. embedded album art decode
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# KSP — annotation processor backend used by Room + Hilt
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Hilt gradle plugin — application of @HiltAndroidApp, member-injection across Composables
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
